troubleshooting.title=Troubleshooting
troubleshooting.header=Common launcher problems
troubleshooting.text=If an update cannot rename the game folder, close the game and launcher, restart the computer, and try again. Antivirus software or overlays can also temporarily lock the folder. If the problem remains, open the log file and check which process is holding the game folder.
troubleshooting.rename.header=The game folder is locked
troubleshooting.rename.text=The launcher could not rename the game folder to create a safe backup. Close the game and launcher completely, restart the computer, and run the update again. If it still fails, temporarily check antivirus quarantine/protection and send the launcher log to the developer.

